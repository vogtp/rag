<mat-card>
    <!-- <mat-card-header>
        <mat-card-title>{{collection()!.Name}}</mat-card-title>
        <mat-card-subtitle></mat-card-subtitle> 
    </mat-card-header> -->

    <mat-card-content>
        <mat-form-field>
            <mat-label>Collection Name</mat-label>
            <input matInput [(ngModel)]="collection()!.Name">
        </mat-form-field>

        <mat-form-field style="padding-bottom: 20px;">
            <mat-label>API Key (for chatbots)</mat-label>
            <input matInput [(ngModel)]="collection()!.APIKey">
            <mat-hint style="vertical-align: middle;">This key can be used to acces this collection with a chat ui at the <a
                    href="/api">endpoint</a>.</mat-hint>
        </mat-form-field>
        <mat-card appearance="outlined">
            <mat-card-header>
                <!-- <mat-card-actions>
                  
                    <button matButton="tonal" (click)="addSource()">Add New Source</button>
                </mat-card-actions> -->
                <!-- <mat-card-subtitle>Source Systems</mat-card-subtitle> -->
            </mat-card-header>

            <mat-card-content>

                <mat-tab-group>
                    <div *ngFor="let src of collection()!.edges!.Sources; let i = index">
                        <mat-tab label="{{ collection()!.edges!.Sources![i].Name }}">
                            <app-source [(source)]="collection()!.edges!.Sources![i]" />
                        </mat-tab>
                    </div>
                </mat-tab-group>
            </mat-card-content>
        </mat-card>

    </mat-card-content>
</mat-card>

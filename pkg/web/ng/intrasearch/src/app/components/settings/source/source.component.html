<mat-card class="example-card" appearance="outlined">
    <mat-card-header>
        <!-- <mat-card-title>{{source()!.Name}}</mat-card-title> -->
        <mat-card-subtitle>Type: {{source()!.Type}}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <mat-form-field>
            <mat-label>Name</mat-label>
            <input matInput [(ngModel)]="source()!.Name">
        </mat-form-field>

        <!-- <mat-form-field>
            <mat-label>Type</mat-label>
            <input matInput [(ngModel)]="source()!.Type">
        </mat-form-field> -->
        <mat-form-field>
            <mat-label>URL</mat-label>
            <input matInput [(ngModel)]="source()!.URL">
        </mat-form-field>
        <mat-form-field>
            <mat-label>Personal Access Token</mat-label>
            <input matInput [(ngModel)]="source()!.key" />
            <mat-hint>
                Get your <i>Personal Access Token</i> in your
                <a href="{{source()!.URL}}/plugins/personalaccesstokens/usertokens.action"> profile settings</a>.
            </mat-hint>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Spaces keys (separeted by comma, e.g. "HR,ITSKB")</mat-label>
            <input matInput [(ngModel)]="source()!.parts">
        </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
        <button matButton="tonal">Delete Source</button>
    </mat-card-actions>
</mat-card>

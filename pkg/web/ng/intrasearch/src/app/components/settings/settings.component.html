<p>
    <mat-form-field>
        <mat-label>User</mat-label>
        <input matInput readonly [ngModel]="userSettings?.Name">
    </mat-form-field>
</p>

<div class="collections">
    <div *ngFor="let col of userSettings?.edges?.Collections">
        <app-collection [collection]="col" />
    </div>
</div>

<p>
    <mat-form-field>
        <mat-label>Chat API Key</mat-label>
        <input matInput readonly [(ngModel)]="apiKey">
    </mat-form-field>
    <button (click)="onGenerateKey()">
        Generate
    </button>
    <button (click)="onCopyKey()">
        Copy
    </button>
</p>

<button (click)="onSaveClick()" matFab extended aria-label="Save Settings">
    <mat-icon>save</mat-icon>
    Save Settings
</button>

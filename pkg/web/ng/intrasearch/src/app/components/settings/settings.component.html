<p>
    <mat-form-field>
        <mat-label>User</mat-label>
        <input matInput readonly [ngModel]="userSettings?.Name">
    </mat-form-field>
</p>

<mat-tab-group>
    <div *ngFor="let col of userSettings?.edges?.Collections">
        <mat-tab label="{{ col.Name }}"> <app-collection [collection]="col" /> </mat-tab>
    </div>
</mat-tab-group>

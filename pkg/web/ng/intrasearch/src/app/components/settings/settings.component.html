<p>
    <mat-form-field>
        <mat-label>User</mat-label>
        <input matInput readonly [(ngModel)]="userSettings!.Name">
    </mat-form-field>
</p>


<p>
    <button (click)="debug()">
        Debug
    </button>
    <button (click)="onCopyKey()">
        Copy
    </button>
</p>



<mat-tab-group>
    <div *ngFor="let cols of collections()!; let i = index">
        <mat-tab label="{{collections()![i]!.Name }}">
            <app-collection [(collection)]="collections()![i]!" /> </mat-tab>
    </div>
</mat-tab-group>

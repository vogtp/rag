log:
  level: info
web:
  listen: ":4444"
http:
  user_agent: "rag-test"
oidc:
  client_id: "TestCliendID"
  client_secret: "Secret"
  issuer: "https://idp.example.com:443/auth/"
  redirect_uri: "http://localhost:4444/auth/callback"

backends:
  - name: ollama
    api:
      URL: "https://ollama.example.com:11434"
      type: ollama
    models:
      - name: bge-m3
        type: embedding
      - name: qwen3
        type: llm
      - name: mistral
        type: llm
      - name: mxbai-embed-large
        type: embedding
      - name: nomic-embed-text
        type: embedding
      - name: embeddinggemma
        type: embedding
  - name: LiteLLM
    api:
      URL: "https://llm.example.net/litellm"
      key: "myLiteLLMKey"
      type: openai
    models:
      - name: qwen3-235b-fp8
        type: llm
      - name: GLM-4.5V-FP8
        type: image2txt

chroma:
  container:
    name: "chroma"
    port: "8000"
vecdb:
  update_intervall: 24h
  update_delay: 24ms
  collection_name: "rag"

log:
  level: info
  source: true
  json: true
web:
  listen: ":4444"
oidc:
  client_id: "OIDC_CLIENT_ID"
  client_secret: "S3cret"
  issuer: "https://example.net/auth/endpoint"
  redirect_uri: "http://localhost:4444/auth/callback"
ollama:
  hosts:
    - "http://ollama.host.example.com:11434"
model:
#  embedding: "bge-m3"
#  default: "mistral"
vecdb:
  update_intervall: 24h
chroma:
  url: "http://localhost:8000"
  container:
    name: "chroma"
    port: "8000"
    image: "chromadb/chroma:latest"
confluence:
  baseURL: "https://confluence.example.net/"
  #maxAge: 7*356*24h
